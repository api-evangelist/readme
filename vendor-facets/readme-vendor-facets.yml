# Vendor facets — ReadMe. A hosted developer hub (guides, OpenAPI reference with Try It!,
# changelog, forums, personalized docs) that added a full agent-discoverability panel in 2026:
# llms.txt, an RFC 9727 api-catalog, an agent-skills index, content signals, Markdown for agents,
# an MCP server card and a hosted MCP server whose tools can call the API. The lift spreads across
# Developer Ergonomics pointers and Agent Readiness; the MCP server is one template (`platform`),
# and nothing reaches Contract Quality unless the API Designer is the provider's only contract.
vendor: readme
name: ReadMe
website: https://readme.com
areas:
- documentation
- developer-portal
registry_keys:
- readme
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: measured
summary: >-
  ReadMe is the broadest developer-portal lift in this set: Try It!, a changelog with RSS, forums, Getting
  Started and Authentication landing pages, recipes, and a Discoverability panel (llms.txt, RFC 9727 api-catalog,
  agent-skills index, content signals) that is on every plan. Most of those are pointer checks, so they
  count only once the provider declares them in its apis.json. The hosted MCP server is the most capable
  docs MCP here (its execute-request tool calls the API), but it is one ReadMe template on readme.io or
  the hub domain, so the rubric grades it `platform`; and ReadMe renders the OpenAPI it is given, so Contract
  Quality does not move.
features:
- id: hosted-hub
  name: Hosted developer hub with guides and API reference
  description: >-
    A hosted docs hub with Markdown/MDX guides and an API reference generated from uploaded OpenAPI (through
    3.1, Swagger 2.0 up-converted).
  source: https://docs.readme.com/main/docs/openapi-compatibility-chart
  tier: all
- id: try-it
  name: Try It! API explorer
  description: >-
    Readers call the API from the reference, with OAuth flows applied from the spec's security schemes
    and personalized keys for logged-in users.
  source: https://docs.readme.com/main/docs/api-exploration-tools
  tier: all
- id: reference-landing-pages
  name: Getting Started and Authentication landing pages
  description: >-
    Built-in Getting Started and Authentication pages in the API reference that surface the reader's own
    keys.
  source: https://docs.readme.com/main/docs/reference-core-pages
  tier: all
- id: changelog
  name: Changelog with RSS
  description: >-
    A dated changelog feed with typed posts (Added, Fixed, Deprecated, Removed), Git-backed and served
    as RSS.
  source: https://docs.readme.com/main/docs/changelog
  tier: all
- id: recipes
  name: Recipes
  description: Stepped, annotated code walkthroughs for common API use cases.
  source: https://docs.readme.com/main/docs/writing-docs/llms.txt
  tier: all
- id: forums
  name: Discussion forums and dev FAQ
  description: In-hub Q&A forums with team replies and an FAQ built from them.
  source: https://docs.readme.com/main/docs/developer-experience/llms.txt
  tier: all
- id: llms-txt
  name: Generated llms.txt (split by section or category)
  description: >-
    Publishes an auto-updated llms.txt at the hub root, optionally split per section and category, or
    served from a provider-authored file in Git.
  source: https://docs.readme.com/main/docs/ai-discoverability
  tier: all
- id: api-catalog
  name: RFC 9727 api-catalog and Link headers
  description: >-
    Publishes /.well-known/api-catalog listing every API definition in the project with links to each
    OpenAPI, advertised by RFC 8288 Link headers.
  source: https://docs.readme.com/main/docs/ai-discoverability
  tier: all
- id: skills-index
  name: Agent Skills discovery index
  description: Publishes /.well-known/agent-skills/index.json (v0.2.0) advertising skills for the documentation.
  source: https://docs.readme.com/main/docs/ai-discoverability
  tier: all
- id: content-signals
  name: Content signals for AI use
  description: Per-project allow/deny signals for model training, search indexing and prompt context.
  source: https://docs.readme.com/main/docs/ai-discoverability
  tier: all
- id: markdown-for-agents
  name: Markdown for agents
  description: >-
    Returns Markdown to Accept text/markdown requests and at <page>.md, with sub-page and sibling links
    for crawling.
  source: https://docs.readme.com/main/docs/ai-discoverability
  tier: all
- id: hosted-mcp
  name: Hosted MCP server
  description: >-
    A per-project MCP server at <project>.readme.io/mcp with OpenAPI tools (list/get/search endpoints,
    execute-request) on all plans and docs search/fetch with the AI Booster Pack.
  source: https://docs.readme.com/main/docs/mcp
  tier: all
- id: mcp-server-card
  name: MCP server card and WebMCP tools
  description: >-
    Serves /.well-known/mcp/server-card.json and registers search/navigate/read/try tools in the browser
    via navigator.modelContext.
  source: https://docs.readme.com/main/docs/ai-discoverability
  tier: all
- id: api-designer
  name: API Designer
  description: >-
    Build an API reference in a visual editor with no OpenAPI file; the result is stored and served as
    an OpenAPI definition.
  source: https://docs.readme.com/main/docs/api-designer
  tier: all
- id: health-check
  name: Health check banner
  description: >-
    A hub banner driven by a manual toggle or a Statuspage.io sync that links to the provider's status
    URL.
  source: https://docs.readme.com/main/docs/health-check-status-updates
  tier: paid
- id: postman-sync
  name: Postman collection sync
  description: Deploys Postman collections into the reference and lets readers fork a collection into
    Postman.
  source: https://docs.readme.com/main/docs/postman-1
  tier: all
- id: webhooks-rendering
  name: OpenAPI 3.1 webhooks rendering
  description: Renders the webhooks object alongside paths in the reference.
  source: https://docs.readme.com/main/docs/openapi-compatibility-chart
  tier: all
