earns_nothing:
- feature: mcp-server-card
  check: well_known_published
  why: >-
    The MCP server card is not an api-catalog, security.txt, protected-resource or AAuth document; only
    the api-catalog row earns this check.
- feature: health-check
  check: status_page_present
  why: >-
    A banner that relays Statuspage.io is not a status page; the provider still needs its own StatusPage.
- feature: postman-sync
  check: postman_present
  why: >-
    ReadMe consumes collections and offers a fork button; the collection itself must be one the provider
    publishes.
- feature: hosted-hub
  check: examples_present
  why: >-
    Rendering a spec's examples writes none into the contract; contract-side examples are the provider's
    own work.
out_of_reach:
  checks:
  - info_complete
  - operations_description_coverage
  - error_responses_documented
  - sdk_count_1
  - sdk_count_3
  - cli_present
  - rules_present
  - openapi_3_2
  note: >-
    ReadMe renders up to OpenAPI 3.1 and does not edit the contract, generate SDKs or a CLI for the provider,
    or publish a governance ruleset.
unscored_practice:
- feature: markdown-for-agents
  why: Accept text/markdown negotiation and .md twins; no check reads markdown negotiation.
- feature: mcp-server-card
  why: SEP-1649 server card and WebMCP tools are real agent discovery surfaces no check reads.
- feature: llms-txt
  why: >-
    The agent hint banner and llms.txt ?query= search are agent affordances the llms.txt row does not
    distinguish from a stub file.
