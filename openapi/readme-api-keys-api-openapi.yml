openapi: 3.2.0
info:
  title: ReadMe API Keys API
  description: The ReadMe API (v2) lets you programmatically control your ReadMe developer hub. It manages API definitions, API reference pages, guides, changelog, custom pages, categories, branches (versions), images, recipes, and search.
  version: '2.0'
  contact:
    name: ReadMe Support
    url: https://docs.readme.com
  license:
    name: Proprietary
    url: https://readme.com/tos
servers:
- url: https://api.readme.com/v2
  description: ReadMe API v2 base URL
- url: https://dash.readme.io/api/v1
  description: ReadMe API v1 (legacy)
security:
- bearerAuth: []
tags:
- name: API Keys
  description: Manage ReadMe API keys
paths:
  /apikeys:
    get:
      tags:
      - API Keys
      summary: List API Keys
      responses:
        '200':
          description: API keys
    post:
      tags:
      - API Keys
      summary: Create An API Key
      responses:
        '201':
          description: Created
  /apikeys/{id}:
    delete:
      tags:
      - API Keys
      summary: Delete An API Key
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Use your ReadMe API key as a Bearer token in the Authorization header.
