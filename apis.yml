- aid: readme:mcp-server
  name: ReadMe MCP Server
  description: >-
    ReadMe operates a hosted Model Context Protocol (MCP) server that lets AI tools (Claude, Cursor, IDEs,
    CI pipelines) search, read, and update ReadMe documentation through natural language. ReadMe also
    auto-provisions a per-project MCP server for every customer so end users' AI tools can read, search,
    and call that project's API directly.
  humanURL: https://docs.readme.com/main/docs/readmes-mcp-server
